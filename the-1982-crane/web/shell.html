<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The 1982 Crane - a first-person horror game. Berth 9, Port of Ashgrove, November 11, 1982.">
<title>The 1982 Crane</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #8b877a;
    font-family: "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas#canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none;
    touch-action: none; background: #000; cursor: default; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px; box-sizing: border-box; font-size: 15px; letter-spacing: 0.08em; line-height: 1.6; pointer-events: none; }
  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #d8d2bf; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">THE 1982 CRANE<br>loading...</div>
<noscript>The 1982 Crane needs JavaScript and WebGL 2.</noscript>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    onAbort: function (what) {
      var el = document.getElementById('status');
      el.style.display = 'flex';
      el.textContent = 'Something went wrong while starting the game (' + what + '). Reloading usually fixes it.';
    }
  };
  window.addEventListener('error', function (e) {
    if (!e || !e.message) return;
    console.error(e.message);
  });
  // keep the page from scrolling or zooming on touch screens
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 || e.target === Module.canvas) e.preventDefault(); }, { passive: false });
</script>
{{{ SCRIPT }}}
</body>
</html>

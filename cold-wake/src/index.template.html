<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Cold Wake - a first-person game aboard a stricken deep-space survey ship.">
<title>Cold Wake</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Cold Wake game view"></canvas>
  <div id="touch-layer"></div>
  <div id="stick-base" hidden><div id="stick-knob"></div></div>

  <div id="fx-frost" class="fx"></div>
  <div id="fx-helmet" class="fx" hidden>
    <div class="visor-top"></div><div class="visor-bottom"></div>
    <div class="visor-line l"></div><div class="visor-line r"></div>
  </div>
  <div id="fx-damage" class="fx"></div>
  <div id="fx-flash" class="fx"></div>
  <div id="fx-fade" class="fx"></div>
  <div id="letterbox" class="fx"><i></i><i></i></div>

  <div id="hud" hidden>
    <section id="hud-mission" aria-live="polite">
      <div class="tag" id="mission-tag">MISSION</div>
      <div id="mission-title"></div>
      <div id="mission-text"></div>
      <ul id="mission-list"></ul>
    </section>
    <div id="hud-compass"><div id="compass-tape"></div><i></i></div>
    <section id="hud-nav">
      <canvas id="minimap" width="264" height="264"></canvas>
      <div id="room-name"></div>
    </section>
    <section id="hud-vitals">
      <div class="vital" id="vital-hp"><span>VITALS</span><b><i></i></b></div>
      <div class="vital" id="vital-o2" hidden><span>SUIT O2</span><b><i></i></b><em></em></div>
      <div class="chips" id="chips"></div>
    </section>
    <div id="crosshair"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="ring-bg" cx="32" cy="32" r="22"/><circle class="ring" cx="32" cy="32" r="22"/></svg><i></i></div>
    <div id="waypoint" hidden><div class="wp-arrow"></div><div class="wp-label"></div></div>
    <div id="markers"></div>
    <div id="subtitle" hidden><span id="sub-speaker"></span><span id="sub-text"></span></div>
    <div id="prompt" hidden><kbd id="prompt-key">E</kbd><span id="prompt-text"></span></div>
    <div id="hint" hidden></div>
    <div id="banner" hidden><small></small><b></b><i></i></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="hud-buttons">
      <button type="button" id="btn-pause" data-action="pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></svg></button>
      <button type="button" id="btn-map" data-action="map" aria-label="Map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg></button>
    </div>
    <div id="touch-buttons">
      <button type="button" id="btn-flash" data-action="flash" aria-label="Flashlight"><svg viewBox="0 0 24 24"><path d="M8 3h8l-1 6 2 3v9H7v-9l2-3zM10 14h4"/></svg></button>
      <button type="button" id="btn-jump" data-action="jump" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M5 14l7-7 7 7M5 20l7-7 7 7"/></svg></button>
      <button type="button" id="btn-interact" data-action="interact" aria-label="Use"><span id="btn-interact-label">USE</span></button>
    </div>
    <section id="turret-ui" hidden>
      <div id="turret-reticle"><i></i><i></i><i></i><i></i><b></b></div>
      <div id="turret-top">
        <div class="tbar"><span>HULL INTEGRITY</span><b><i id="turret-hull"></i></b></div>
        <div class="tinfo"><span id="turret-wave">WAVE 1</span><span id="turret-count"></span></div>
        <div class="tbar"><span>CANNON HEAT</span><b><i id="turret-heat"></i></b></div>
      </div>
      <div id="turret-msg"></div>
    </section>
  </div>

  <div id="overlay-minigame" class="overlay" hidden></div>
  <div id="overlay-reader" class="overlay" hidden></div>
  <div id="overlay-pause" class="overlay" hidden></div>
  <div id="overlay-end" class="overlay" hidden></div>
  <div id="overlay-intro" class="overlay" hidden><div id="intro-lines"></div><button type="button" id="intro-skip">Skip</button></div>
  <div id="overlay-menu" class="overlay" hidden></div>
  <div id="overlay-loading" class="overlay">
    <div class="load-box">
      <div class="load-title">COLD WAKE</div>
      <div class="load-sub" id="load-text">Powering up</div>
      <div class="load-bar"><i id="load-fill"></i></div>
      <div class="load-note" id="load-note">Building the ISV Astraea</div>
    </div>
  </div>
  <div id="fatal" hidden></div>
</div>
<script>/*__JS__*/</script>
</body>
</html>

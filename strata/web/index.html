<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Strata</title>
<meta name="description" content="An endless voxel world of stone, water and sky. Runs in the browser on phones, tablets and computers.">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strata">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d0f14; color: #e8ecf2;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  /* The game fills the screen but stays clear of notches and rounded corners. */
  #canvas {
    position: fixed; display: block; outline: none; touch-action: none;
    top: env(safe-area-inset-top, 0); left: env(safe-area-inset-left, 0);
    width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
  @supports (height: 100dvh) {
    #canvas { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; text-align: center;
    background: radial-gradient(120% 90% at 50% 20%, #24344a 0%, #121821 55%, #0d0f14 100%);
    transition: opacity .5s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card { max-width: 420px; }
  h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: .32em; font-weight: 800; padding-left: .32em; color: #f0ecdc; }
  .sub { margin: 0 0 26px; color: #a9bacb; }
  .bar { height: 4px; width: 220px; margin: 0 auto; border-radius: 2px; background: #263040; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; border-radius: 2px; background: #78be78; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
  #status { margin-top: 14px; font-size: 13px; color: #8193a6; min-height: 1.4em; }
  .error h2 { margin: 0 0 10px; font-size: 20px; }
  .error p { color: #b9c6d4; margin: 0 0 18px; }
  button.action {
    font: inherit; font-weight: 600; color: #0d0f14; background: #9fd29f; border: 0; border-radius: 8px;
    padding: 10px 22px; cursor: pointer;
  }
  #rotate {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); pointer-events: none;
    background: rgba(10, 12, 16, .78); border-radius: 10px; padding: 8px 14px; font-size: 13px; color: #d6dde6;
    opacity: 0; transition: opacity .6s ease; white-space: nowrap;
  }
  #rotate.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" aria-label="Strata game view"></canvas>

<div id="loading" class="overlay">
  <div class="card">
    <h1>STRATA</h1>
    <p class="sub">an endless world of stone, water and sky</p>
    <div class="bar"><i></i></div>
    <div id="status">Loading…</div>
  </div>
</div>

<div id="error" class="overlay hidden error" role="alert">
  <div class="card">
    <h2 id="error-title">Strata cannot start</h2>
    <p id="error-text"></p>
    <button class="action" onclick="location.reload()">Try again</button>
  </div>
</div>

<div id="rotate">Turn your device sideways for the widest view</div>

<script>
(function () {
  'use strict';
  var canvas = document.getElementById('canvas');
  var loading = document.getElementById('loading');
  var statusEl = document.getElementById('status');

  function fail(title, text) {
    if (typeof devLog === 'function') devLog('page error: ' + title + ': ' + text);
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-text').textContent = text;
    document.getElementById('error').classList.remove('hidden');
    loading.classList.add('hidden');
  }

  // WebGL 2 with floating point render targets is required.
  var probe = document.createElement('canvas').getContext('webgl2');
  if (!probe) {
    fail('WebGL 2 is not available',
         'Strata needs a browser with WebGL 2: a recent Chrome, Edge, Firefox or Safari (iOS 15 or later). ' +
         'Hardware acceleration must be enabled.');
    return;
  }
  if (!probe.getExtension('EXT_color_buffer_float') && !probe.getExtension('EXT_color_buffer_half_float')) {
    fail('Graphics not supported', 'This device cannot render to floating point textures, which Strata needs.');
    return;
  }

  // Query string to command line: ?world=demo&seed=42&creative&render-distance=6
  var args = [];
  new URLSearchParams(location.search).forEach(function (value, key) {
    args.push('--' + key);
    if (value !== '') args.push(value);
  });

  // The threaded build needs a cross-origin isolated page (COOP/COEP headers,
  // which sw.js adds once it is installed); otherwise use the single-threaded one.
  var threaded = self.crossOriginIsolated === true && typeof SharedArrayBuffer !== 'undefined';

  // On a local dev server (tools/serve_web.py) the game's log is mirrored to
  // the server's terminal: phones have no developer console.
  var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  function devLog(text) {
    if (!local || !navigator.sendBeacon) return;
    try { navigator.sendBeacon('__strata/log', String(text).slice(0, 2000)); } catch (e) { /* best effort */ }
  }

  var lastError = '';
  window.Module = {
    canvas: canvas,
    arguments: args,
    print: function (text) { console.log(text); devLog(text); },
    printErr: function (text) { console.warn(text); devLog(text); if (/error/.test(text)) lastError = text; },
    setStatus: function (text) { if (text) statusEl.textContent = text; },
    onAbort: function (what) {
      fail('Strata stopped', 'Something went wrong: ' + (lastError || what) + '. Reloading usually helps.');
    },
    strataReady: function () {
      loading.classList.add('hidden');
      hintRotation();
      devLog('page ready: ' + (threaded ? 'multi-threaded' : 'single-threaded') + ' build, ' + innerWidth + 'x' +
             innerHeight + ' CSS px at ' + devicePixelRatio + 'x, ' + navigator.userAgent);
    },
    strataFail: function (text) { fail('Strata cannot start', text); }
  };
  window.addEventListener('error', function (e) {
    if (!loading.classList.contains('hidden')) fail('Strata cannot start', String(e.message || e));
  });

  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    fail('Graphics were reset', 'The browser reclaimed the graphics context (this happens on phones after a long ' +
         'time in the background). Your world was saved; reload to continue.');
  });
  // No context menus, long-press callouts or pinch zoom over the game.
  ['contextmenu', 'gesturestart', 'gesturechange', 'dblclick'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });

  function hintRotation() {
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (!coarse || window.innerWidth >= window.innerHeight) return;
    var el = document.getElementById('rotate');
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 5000);
  }

  // Keep saved worlds when the browser runs low on space.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});

  // Offline support and the headers for the threaded build.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' ||
                                       location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('service worker:', e); });
  }

  function load(name, fallback) {
    var s = document.createElement('script');
    s.src = name + '.js';
    s.async = true;
    s.onerror = function () {
      if (fallback) { load(fallback, null); return; }
      fail('Download failed', 'The game files could not be loaded. Check your connection and try again.');
    };
    document.body.appendChild(s);
  }
  statusEl.textContent = threaded ? 'Loading (multi-threaded)…' : 'Loading…';
  if (threaded) load('strata-mt', 'strata'); else load('strata', null);
})();
</script>
</body>
</html>
